spring.application.name=cafeteria-backend

# Base de datos (todas las credenciales se cargan desde variables de entorno - sin defaults)
spring.datasource.url=jdbc:postgresql://${DB_URL}:${DB_PORT:5432}/${DB_NAME:postgres}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}

# JWT (secret OBLIGATORIO, expiracion con default 24h)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Supabase (credenciales obligatorias por entorno)
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.service-key=${SUPABASE_SERVICE_KEY}

# CORS - lista separada por comas con origenes permitidos. Default dev local.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Logging - nivel seguro para produccion; sobreescribir con LOG_LEVEL_* en dev si hace falta
logging.level.com.utp.cafeteria=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
